[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-watermark"
version = "0.1.0"
description = "LLM Watermark Fine-tuning Pipeline with Parameter-level Embedding"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Anonymous Authors"},
]
keywords = ["llm", "watermark", "fine-tuning", "transformers", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8.1"
dependencies = [
    # Core ML and NLP libraries
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "accelerate>=0.20.0",
    "peft>=0.4.0",
    # Configuration and utilities
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    # Evaluation metrics
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.3.0",
    # Logging and monitoring
    "tqdm>=4.65.0",
    # File handling and I/O
    "jsonlines>=3.1.0",
    "pandas>=2.0.0",
    # Development and debugging
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
# Optional dependencies for enhanced performance
performance = [
    "bitsandbytes>=0.39.0",  # 8-bit optimization
]

# Advanced performance (may require compilation)
advanced = [
    # flash-attn temporarily disabled due to build issues on macOS
    # "flash-attn>=2.0.0; platform_system == 'Linux' and platform_machine != 'arm64'",  # CUDA-only
]

# Optional dependencies for experiment tracking
tracking = [
    "wandb>=0.15.0",
    "tensorboard>=2.13.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# All safe optional dependencies
all = [
    "llm-watermark[performance,tracking,dev]"
]

# All dependencies including advanced (may require compilation)
full = [
    "llm-watermark[performance,tracking,dev,advanced]"
]

[project.urls]
Homepage = "ANONYMISED-FOR-REVIEW"
Repository = "ANONYMISED-FOR-REVIEW"
Documentation = "ANONYMISED-FOR-REVIEW"
"Bug Tracker" = "ANONYMISED-FOR-REVIEW"

[project.scripts]
llm-watermark = "llm_watermark.main:main"
watermark-train = "llm_watermark.main:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_watermark"]

[tool.hatch.build.targets.sdist]
include = [
    "/llm_watermark",
    "/README.md",
    "/LICENSE",
]

# Black code formatting
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy type checking
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "datasets.*",
    "accelerate.*",
    "peft.*",
    "evaluate.*",
    "wandb.*",
    "tensorboard.*",
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]
